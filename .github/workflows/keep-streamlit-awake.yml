name: Keep judging demo awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset-streamlit-timer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Reset Streamlit inactivity timer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep judging demo awake"
          git push
